name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: depot
          POSTGRES_PASSWORD: depot
          POSTGRES_DB: depot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: depot
      DB_PASSWORD: depot

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.6"
          bundler-cache: true

      - name: Set up database
        run: bundle exec rake db:create db:schema:load

      - name: Build CSS (dartsass)
        run: bundle exec rails dartsass:build

      - name: Run tests
        run: bundle exec rake test

      - name: Run Brakeman
        run: bundle exec brakeman -q -w2 --no-exit-on-warn

      - name: Run bundler-audit
        run: bundle exec bundler-audit check --update
